name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aa
          POSTGRES_PASSWORD: aa
          POSTGRES_DB: aa_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U aa"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://aa:aa@localhost:5432/aa_dev
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=' }}
      SESSION_COOKIE_DOMAIN: localhost
      NODE_ENV: test
      SUPERADMIN_EMAIL: admin@aa-rentacar.com
      SUPERADMIN_PASSWORD: change-me-on-first-login
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit + integration tests
        run: pnpm test

      - name: Re-seed Super-Admin + inventory + test users after vitest truncated users
        run: |
          pnpm db:bootstrap
          pnpm db:seed-inventory
          pnpm db:seed-addons
          pnpm db:seed-test-users

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
