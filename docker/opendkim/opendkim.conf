# OpenDKIM config — AA Rent A Car (Plan #12).
# Signs outbound mail from aa-rentacar.com with selector `default`.

Syslog                  yes
UMask                   002
Mode                    s

# Listen for the Postfix milter on all interfaces, port 8891 (matches
# smtpd_milters = inet:opendkim:8891 in postfix/main.cf).
Socket                  inet:8891@0.0.0.0

# Canonicalization: relaxed header + relaxed body is the widely-accepted default.
Canonicalization        relaxed/relaxed
SignatureAlgorithm      rsa-sha256

# Selector + domain. The private key path is resolved via KeyTable below.
Domain                  aa-rentacar.com
Selector                default

KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
InternalHosts           /etc/opendkim/TrustedHosts
ExternalIgnoreList      /etc/opendkim/TrustedHosts

OversignHeaders         From
AutoRestart             yes
AutoRestartRate         10/1h
